<script>
(()=>{
'use strict';
const DB='NovelStudioDB', VER=4, PROJECTS='projects', RES='resources', SAVES='saves', ACTIVE='activeProjectV4';
let dbp=null, project=null, tab='scene', selectedId=null, saveTimer=0, renderQueued=false;
let undoStack=[], redoStack=[], historySnapshot='', historyApplying=false, collapsedBlocks=new Set();
let drag=null, dragRAF=0, dragRect=null;
const $=id=>document.getElementById(id), clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1300)}
function openDB(){if(dbp)return dbp;dbp=new Promise((resolve,reject)=>{const r=indexedDB.open(DB,VER);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(PROJECTS))d.createObjectStore(PROJECTS,{keyPath:'id'});if(!d.objectStoreNames.contains(RES))d.createObjectStore(RES,{keyPath:'id'});if(!d.objectStoreNames.contains(SAVES))d.createObjectStore(SAVES,{keyPath:'id'})};r.onsuccess=()=>{const db=r.result;db.onversionchange=()=>{try{db.close()}catch(_){}};resolve(db)};r.onerror=()=>reject(r.error||new Error('IndexedDB error'));r.onblocked=()=>reject(new Error('IndexedDB занята другой вкладкой NovelStudio. Закройте другие вкладки/превью приложения и перезапустите.'))});return dbp}
function req(store,mode,fn){return openDB().then(db=>new Promise((resolve,reject)=>{const tx=db.transaction(store,mode),q=fn(tx.objectStore(store));q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)}))}
const getP=id=>req(PROJECTS,'readonly',s=>s.get(id));
const putP=p=>req(PROJECTS,'readwrite',s=>s.put(p));
const allP=()=>req(PROJECTS,'readonly',s=>s.getAll());
const getSave=id=>req(SAVES,'readonly',s=>s.get(id));
const putSave=x=>req(SAVES,'readwrite',s=>s.put(x));
const allSaves=()=>req(SAVES,'readonly',s=>s.getAll());
const delSave=id=>req(SAVES,'readwrite',s=>s.delete(id));
let resList=null;const resCache=new Map();
const putR=async r=>{const v=await req(RES,'readwrite',s=>s.put(r));resCache.set(r.id,r.data||'');resList=null;return v};
const getR=id=>req(RES,'readonly',s=>s.get(id));
async function resources(){if(!resList)resList=await allR();return resList}
const allR=()=>req(RES,'readonly',s=>s.getAll());
const delR=async id=>{const v=await req(RES,'readwrite',s=>s.delete(id));resCache.delete(id);resList=null;return v};
